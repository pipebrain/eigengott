<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>EIGENGOTT — DOS-maze</title><link rel="stylesheet" href="style.css"></head>
<body>
  <canvas id="scene" aria-label="EIGENGOTT. Drifting white maze walls and gothic lettering on black."></canvas>
  <div id="status" role="status"><p id="message">Starting DOS-maze…</p><button id="retry" hidden>Retry</button></div>
  <aside id="controls" aria-label="DOS-maze controls" hidden>
    <header><div><h1>EIGENGOTT</h1><p>DOS-maze <span id="version"></span></p></div><button id="close" aria-label="Close controls">×</button></header>
    <section><h2>Playback</h2>
      <div class="buttons"><button id="pause">Pause</button><button id="step">Step</button><button id="restart">Restart cycle</button></div>
      <label>Time scale <output id="speed-value">×1.00</output><input id="speed" type="range" min="0" max="4" step="0.05" value="1"></label>
      <button id="fullscreen">Fullscreen</button>
    </section>
    <section><h2>Render quality</h2>
      <label>Pixel ratio cap <output id="ratio-value">1.50</output><input id="ratio" type="range" min="0.5" max="2" step="0.1" value="1.5"></label>
      <label class="check"><input id="antialias" type="checkbox" checked>4× antialiasing</label>
      <button id="reset-quality">Reset quality</button>
      <p class="hint">Lower the pixel ratio or disable antialiasing to reduce GPU work. These options save in this browser.</p>
    </section>
    <section><h2>Diagnostics</h2><pre id="diagnostics" aria-live="off">Starting…</pre><button id="copy-diagnostics">Copy diagnostics</button><p id="feedback" class="hint" role="status"></p></section>
    <footer>H · controls &nbsp; Space · pause &nbsp; R · restart &nbsp; F · fullscreen</footer>
  </aside>
  <noscript>This title screen requires JavaScript, WebAssembly, and WebGPU.</noscript>
  <script type="module" src="main.js"></script>
</body></html>
