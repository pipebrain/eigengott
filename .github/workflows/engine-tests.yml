name: 3D engine checks

on:
  push:
    branches: [main]
    paths: ['engine-test/**', '.github/workflows/engine-tests.yml']
  pull_request:
    paths: ['engine-test/**', '.github/workflows/engine-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned freestanding Rust compiler
        run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - name: Check JavaScript syntax
        run: |
          for source in engine-test/*.js engine-test/tools/*.mjs; do
            node --check "$source"
          done
      - name: Rebuild WASM
        run: sh engine-test/tools/build-wasm.sh
      - name: Verify checked-in WASM matches its source
        run: git diff --exit-code -- engine-test/engine.wasm
      - name: Validate generation, arena transactions, memory, and 3D collision
        run: node engine-test/tools/check-core.mjs
