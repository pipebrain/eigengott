name: Verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned Rust and WASM C compilers
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Check browser and deployment JavaScript
        run: |
          for source in site/*.js tools/build-pages.mjs tools/check-pages.mjs engine-test/*.js engine-benchmark/*.js dos-maze/*.js vector-labyrinth/*.js; do
            node --check "$source"
          done
      - name: Rebuild accepted engine and benchmark WASM
        run: |
          sh engine-test/tools/build-wasm.sh
          sh engine-benchmark/tools/build-wasm.sh
          git diff --exit-code -- engine-test/engine.wasm engine-benchmark/engine.wasm
      - name: Rebuild DOS-maze WASM
        env:
          WASM_CC: clang
        run: sh dos-maze/tools/build-wasm.sh
      - name: Verify all deterministic engine and title checks
        run: |
          node engine-test/tools/check-core.mjs
          node engine-benchmark/tools/check-core.mjs
          node dos-maze/tools/check-generator.mjs
          node dos-maze/tools/check-animation.mjs
      - name: Stage and verify the static runtime package
        run: |
          node tools/build-pages.mjs
          node tools/check-pages.mjs
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
