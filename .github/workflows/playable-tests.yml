name: Playable equipment milestone checks
on:
  push:
    branches: [main]
    paths: ['playable-test/**', 'audio-previews/**', '.github/workflows/playable-tests.yml']
  pull_request:
    paths: ['playable-test/**', 'audio-previews/**', '.github/workflows/playable-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playable-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned freestanding Rust compiler
        run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - name: Check JavaScript
        run: |
          for source in playable-test/*.js playable-test/tools/*.mjs; do
            node --check "$source"
          done
      - name: Rebuild and verify checked-in WASM
        run: |
          sh playable-test/tools/build-wasm.sh
          git diff --exit-code -- playable-test/engine.wasm
      - name: Verify media, character envelopes, weapons, routes and automatic encounters
        run: |
          node playable-test/tools/check-core.mjs
          node audio-previews/tools/check-audio.mjs
